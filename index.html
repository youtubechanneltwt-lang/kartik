<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockCraft - Minecraft Like Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="crosshair">+</div>

  <div id="info">
    <h1>🌳 BlockCraft</h1>
    <p>W A S D - Move</p>
    <p>SPACE - Jump</p>
    <p>LEFT CLICK - Break Block</p>
    <p>RIGHT CLICK - Place Block</p>
    <p>1-5 - Select Block</p>
  </div>

  <div id="hotbar">
    <div class="slot selected" data-block="grass">🌱</div>
    <div class="slot" data-block="dirt">🟫</div>
    <div class="slot" data-block="stone">⬜</div>
    <div class="slot" data-block="wood">🪵</div>
    <div class="slot" data-block="sand">🟨</div>
  </div>

  <div id="startScreen">
    <h1>⛏️ BLOCKCRAFT</h1>
    <p>A Minecraft-like browser game</p>
    <button id="startButton">START GAME</button>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
